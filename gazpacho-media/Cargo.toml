[package]
name = "gazpacho-media"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
num-rational.workspace = true
num-traits.workspace = true
tracing.workspace = true
eyre.workspace = true
ffmpeg-sidecar.workspace = true
gazpacho-datatypes = { path = "../gazpacho-datatypes" }
clru = "0.6.3"

[dev-dependencies]
tracing-subscriber = { workspace = true, features = ["env-filter"] }
rand.workspace = true
gazpacho-fixtures = { path = "../gazpacho-fixtures" }
libtest-mimic.workspace = true
itertools = "0.15.0"

# Custom libtest-mimic harnesses: one test case per (property × video),
# parallel and individually filterable, under both `cargo test` and nextest.
[[test]]
name = "properties"
harness = false

[[test]]
name = "synthetic"
harness = false
