[package]
name = "gazpacho-media"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true

[dependencies]
num-rational.workspace = true
num-traits.workspace = true
tracing.workspace = true
eyre.workspace = true
ffmpeg-sidecar = { version = "2.4.0", default-features = false }
clru = "0.6.3"
tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[features]
# Exposes `gazpacho_media::fixtures` (synthetic test-video generation) to
# integration tests and other crates: `cargo test --features fixtures`.
# Unit tests inside this crate get the module unconditionally via cfg(test).
fixtures = ["dep:tracing-subscriber"]
