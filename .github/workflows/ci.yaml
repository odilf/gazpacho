name: Cargo Build & Test

on:
  push:
  pull_request:

env: 
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    name: Rust project - latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v17
      - name: Cache downloaded video fixtures
        uses: actions/cache@v4
        with:
          path: |
            target/gazpacho-fixtures/chromium
            target/gazpacho-fixtures/realistic
          key: gazpacho-fixtures-${{ hashFiles('gazpacho-fixtures/scripts/chromium.py', 'gazpacho-fixtures/scripts/realistic.py') }}
          restore-keys: |
            gazpacho-fixtures-
      - run: nix develop --command cargo check --verbose
      # - run: nix develop --command cargo clippy --verbose
      - run: nix develop --command cargo nextest run --verbose
  
