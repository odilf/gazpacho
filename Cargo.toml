[workspace]
resolver = "3"
members = ["gazpacho-core", "gazpacho-ui"]

[workspace.package]
version = "0.0.1"
edition = "2024"
authors = ["odilf"]
description = "Good video editing software for all"
license = "GPL-3.0-or-later"

[workspace.dependencies]
color-eyre = "0.6.5"
ffmpeg-sidecar = "2.4.0"
itertools = "0.14.0"
serde = "1.0.228"
serde_json = "1.0.149"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
phf = "0.13.1"
ron = "0.12.1"

[profile.release]
opt-level = 2 # fast and small wasm

# Optimize all dependencies even in debug builds:
[profile.dev.package."*"]
opt-level = 2
