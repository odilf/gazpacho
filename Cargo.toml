[workspace]
resolver = "3"
members = ["gazpacho-media"]

[workspace.package]
version = "0.0.1"
edition = "2024"
authors = ["odilf"]
description = "Good video editing software for all"
license = "GPL-3.0-or-later"

[workspace.dependencies]
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
num-traits = "0.2.19"
num-rational = "0.4.2"
eyre = "0.6.12"

[profile.release]
opt-level = 2 # fast and small wasm

# Optimize all dependencies even in debug builds:
[profile.dev.package."*"]
opt-level = 2
